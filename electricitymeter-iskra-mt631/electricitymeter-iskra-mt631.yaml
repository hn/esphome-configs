# (C) 2026 Hajo Noerenberg
#
# Usage: Connect IR receiver to pin D5
#
# The electricity meter seems to change most OBIS values according to PIN status:
# - PIN locked: energy values in kWh, current power not available
# - PIN unlocked: energy values in Wh multiplied with 10, current power available (in W)
