esphome:
  name: electricitymeter-iskra-mt631
  friendly_name: Electricity Meter ISKRA MT631

esp8266:
  board: d1_mini

substitutions:
  throttle_time: "42s"
  sml_server_id: "123456789ABCDEF"

logger:

api:
  encryption:
    key: !secret device_name__encryption_key

ota:
  - platform: esphome
    encryption:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Electricitymeter Fallback Hotspot"
    password: !secret wifi_ap_password

captive_portal:

uart:
  id: uart_bus
  rx_pin: D5
  baud_rate: 9600
  data_bits: 8
  parity: NONE
  stop_bits: 1

sml:
  id: ir_sml
  uart_id: uart_bus

sensor:
  - platform: sml
    name: "Bezug, tariflos"
    sml_id: ir_sml
    #server_id: ${sml_server_id}
    obis_code: "1-0:1.8.0"
    unit_of_measurement: Wh
    accuracy_decimals: 1
    device_class: energy
    state_class: total_increasing
    filters:
      - multiply: 0.1
      - throttle: ${throttle_time}
  - platform: sml
    name: "Bezug, Tarif 1"
    sml_id: ir_sml
    #server_id: ${sml_server_id}
    obis_code: "1-0:1.8.1"
    unit_of_measurement: Wh
    accuracy_decimals: 1
    device_class: energy
    state_class: total_increasing
    filters:
      - multiply: 0.1
      - throttle: ${throttle_time}
  - platform: sml
    name: "Bezug, Tarif 2"
    sml_id: ir_sml
    #server_id: ${sml_server_id}
    obis_code: "1-0:1.8.2"
    unit_of_measurement: Wh
    accuracy_decimals: 1
    device_class: energy
    state_class: total_increasing
    filters:
      - multiply: 0.1
      - throttle: ${throttle_time}
  - platform: sml
    name: "Einspeisung, tariflos"
    sml_id: ir_sml
    #server_id: ${sml_server_id}
    obis_code: "1-0:2.8.0"
    unit_of_measurement: Wh
    accuracy_decimals: 1
    device_class: energy
    state_class: total_increasing
    filters:
      - multiply: 0.1
      - throttle: ${throttle_time}
  - platform: sml
    name: "Wirkleistung gesamt"
    sml_id: ir_sml
    #server_id: ${sml_server_id}
    obis_code: "1-0:16.7.0"
    unit_of_measurement: W
    accuracy_decimals: 0
    device_class: power
    state_class: measurement
    filters:
      - throttle: ${throttle_time}

text_sensor:
  - platform: sml
    name: "Manufacturer"
    sml_id: ir_sml
    #server_id: ${sml_server_id}
    obis_code: "1-0:96.50.1"
    format: text
    entity_category: diagnostic
    icon: mdi:factory
  - platform: sml
    name: "Serial number"
    sml_id: ir_sml
    #server_id: ${sml_server_id}
    obis_code: "1-0:96.1.0"
    format: text
    entity_category: diagnostic
    icon: mdi:numeric
    filters:
      - lambda: |-
          if ((x.size() != 10) || (x.at(0) != 0x0a)) {
            return format_hex_pretty((uint8_t *) x.c_str(), x.size());
          }
          // DIN 43863-5 Ausgabe 04-2012
          // 0x00 Sparte: 0x01 = Elektrizität
          // 0x01 Herstellerkennzeichnung: 0x49534b = "ISK"
          // 0x04 Fabrikationsblock: 0x00
          // 0x05 Fabrikationsnummer: 0x05432123
          std::string buffer(32, '\0');
          int len = snprintf(buffer.data(), buffer.size(), "%d%.3s%02d%08u", 
            static_cast<unsigned char>(x[1]), 
            &x[2], 
            static_cast<unsigned char>(x[5]), 
            encode_uint32(x[6], x[7], x[8], x[9])
          );
          buffer.resize(len);
          return buffer;
